name: Fooladban tests
on:
  push:
    branches: [main]
    paths: ['core/**','workers/**','tests/**','package.json','index.html','sw.js','README.md','docs/**','.github/workflows/test.yml','.github/workflows/pages.yml','.github/workflows/android.yml']
  pull_request:
    paths: ['core/**','workers/**','tests/**','package.json','index.html','sw.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check workers/steel-api.js && node --check workers/price-proxy.js && node --check sw.js
      - run: npm test
      - run: python3 tests/schema_test.py
      - run: python3 tests/check_ui.py
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 >/tmp/fooladban-http.log 2>&1 & sleep 2; node tests/browser.smoke.cjs