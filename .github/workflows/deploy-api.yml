name: Deploy Fooladban API
on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Cloudflare deployment
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          APP_ORIGIN: ${{ vars.FOOLADB_APP_ORIGIN }}
          ALLOWED_HOSTS: ${{ vars.FOOLADB_ALLOWED_HOSTS }},qeymato.com,ime.co.ir
        run: |
          test -n "$D1_DATABASE_ID" || (echo "Missing D1_DATABASE_ID secret" && exit 1)
          test -n "$APP_ORIGIN" || (echo "Missing FOOLADB_APP_ORIGIN variable" && exit 1)
          test -n "$ALLOWED_HOSTS" || (echo "Missing FOOLADB_ALLOWED_HOSTS variable" && exit 1)
          sed -i "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$D1_DATABASE_ID/" workers/wrangler.toml
          sed -i "s|https://YOUR_GITHUB_PAGES_DOMAIN|$APP_ORIGIN|" workers/wrangler.toml
          sed -i "s|example.com,prices.example.ir|$ALLOWED_HOSTS|" workers/wrangler.toml
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute fooladban-db --remote --file=workers/schema.sql --config workers/wrangler.toml
      - name: Deploy API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/wrangler.toml
      - name: Set API and FX secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.FOOLADB_API_TOKEN }}
          USD_IRR: ${{ secrets.FOOLADB_USD_IRR }}
          AED_IRR: ${{ secrets.FOOLADB_AED_IRR }}
          EUR_IRR: ${{ secrets.FOOLADB_EUR_IRR }}
          CNY_IRR: ${{ secrets.FOOLADB_CNY_IRR }}
          INR_IRR: ${{ secrets.FOOLADB_INR_IRR }}
          TRY_IRR: ${{ secrets.FOOLADB_TRY_IRR }}
          GBP_IRR: ${{ secrets.FOOLADB_GBP_IRR }}
        run: |
          test -n "$API_TOKEN" || (echo "Missing FOOLADB_API_TOKEN secret" && exit 1)
          printf '%s' "$API_TOKEN" | npx --yes wrangler@4 secret put API_TOKEN --config workers/wrangler.toml
          for name in USD_IRR AED_IRR EUR_IRR CNY_IRR INR_IRR TRY_IRR GBP_IRR; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --config workers/wrangler.toml; fi
          done
      - name: Configure product-specific steel price pages
        env:
          API_TOKEN: ${{ secrets.FOOLADB_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = "https://fooladban-steel-api.n-razaniemail.workers.dev"
          ua = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36 FooladbanDeployCheck/1.0"
          def call(path, payload=None):
              headers = {"Accept": "application/json", "User-Agent": ua, "Authorization": "Bearer " + os.environ["API_TOKEN"]}
              data = None
              method = "GET"
              if payload is not None:
                  method = "POST"
                  data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))
          sources = call("/sources")
          configs = {
              "422f16f3-c5f8-405f-abcf-96540ef5306a": ("اسلب[^0-9۰-۹٠-٩]{0,80}([0-9۰-۹٠-٩,٬]+)", "اسلب (تختال)"),
              "6ffffadd-9ebf-4bd6-b95c-3e607313fd5a": ("ورق گرم[^0-9۰-۹٠-٩]{0,500}([0-9۰-۹٠-٩,٬]+)", "ورق گرم")
          }
          updated = 0
          for source in sources:
              if source["id"] not in configs:
                  continue
              regex, label = configs[source["id"]]
              payload = {key: source.get(key) for key in ("id", "product_key", "product_name", "specification", "source_kind", "market", "currency", "measure_unit", "delivery", "tax_basis", "interval_minutes")}
              payload.update({"url": "https://qeymato.com/fa/commodities", "parser_mode": "regex", "regex": regex, "selector": "", "json_path": "price", "currency": "IRT", "measure_unit": "kg", "interval_minutes": 15})
              result = call("/sources", payload)
              assert result.get("ok") is True, result
              updated += 1
              print("Configured source:", label, "from Qeymato commodity exchange summary")
          if updated != 2:
              raise SystemExit("Expected to configure both existing steel sources; updated " + str(updated))
          PY

      - name: Configure official IME hot-rolled source
        env:
          API_TOKEN: ${{ secrets.FOOLADB_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = "https://fooladban-steel-api.n-razaniemail.workers.dev"
          headers = {"Accept":"application/json","Authorization":"Bearer "+os.environ["API_TOKEN"],"Content-Type":"application/json"}
          def call(path, payload=None):
              req=urllib.request.Request(base+path,data=json.dumps(payload,ensure_ascii=False).encode() if payload is not None else None,headers=headers,method="POST" if payload is not None else "GET")
              with urllib.request.urlopen(req,timeout=30) as response: return json.loads(response.read().decode())
          source_id="75ab74c2-5ba9-4dbc-b83b-7d20bb7fe3f8"
          sources=call("/sources")
          source=next((x for x in sources if x.get("id")==source_id),None)
          if not source: raise SystemExit("Registered IME hot-rolled source not found")
          payload={key:source.get(key) for key in ("id","product_key","product_name","specification","market","delivery","tax_basis")}
          payload.update({"source_kind":"ime","url":"https://www.ime.co.ir/offer-stat.html","parser_mode":"auto","selector":"","regex":"","json_path":"price","currency":"IRT","measure_unit":"kg","interval_minutes":15})
          result=call("/sources",payload)
          assert result.get("ok") is True,result
          print("Official IME source configured:",source.get("product_name"),source.get("product_key"))
          PY
      - name: Verify deployed API health, CORS, and D1 read endpoints
        run: |
          API="https://fooladban-steel-api.n-razaniemail.workers.dev"
          ORIGIN="https://nrazaniemail-ship-it.github.io"
          curl -fsS --max-time 20 "$API/health" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d; print('Health endpoint: OK')"
          curl -fsS --max-time 30 "$API/public/sources" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 sources endpoint: OK ('+str(len(d))+' rows)')"
          curl -fsS --max-time 30 "$API/public/market" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 market endpoint: OK ('+str(len(d))+' rows)')"
          curl -fsS --max-time 30 "$API/public/events" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 events endpoint: OK ('+str(len(d))+' rows)')"
          PRODUCT_KEY="$(curl -fsS --max-time 30 "$API/public/sources" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0][\"product_key\"] if d else \"\")")"
          if [ -n "$PRODUCT_KEY" ]; then
            curl -fsS --max-time 30 --get --data-urlencode "product_key=$PRODUCT_KEY" "$API/public/observations" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 observations endpoint: OK ('+str(len(d))+' rows)')"
          else
            echo "D1 observations endpoint: skipped (no registered sources)"
          fi
          curl -sS --max-time 20 -D /tmp/fooladban-cors-headers -o /dev/null -X OPTIONS "$API/health" -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,content-type"
          grep -qi "access-control-allow-origin: $ORIGIN" /tmp/fooladban-cors-headers
          echo "Browser CORS preflight: OK"
      - name: Verify official IME hot-rolled live price and persisted D1 observation
        env:
          API_TOKEN: ${{ secrets.FOOLADB_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          base="https://fooladban-steel-api.n-razaniemail.workers.dev"
          sid="75ab74c2-5ba9-4dbc-b83b-7d20bb7fe3f8"
          def request(path,method="GET",admin=False):
              headers={"Accept":"application/json","User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 FooladbanIMECheck/1.0"}
              if admin: headers["Authorization"]="Bearer "+os.environ["API_TOKEN"]
              if method=="POST": headers["Content-Type"]="application/json"
              req=urllib.request.Request(base+path,data=b"{}" if method=="POST" else None,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=45) as response: return json.loads(response.read().decode())
              except urllib.error.HTTPError as error:
                  detail=error.read().decode("utf-8","replace")
                  raise RuntimeError("HTTP "+str(error.code)+": "+detail[:400])
          sources=request("/sources",admin=True)
          source=next((x for x in sources if x.get("id")==sid and x.get("enabled")),None)
          if not source: raise SystemExit("Enabled IME source missing from D1")
          if source.get("source_kind")!="ime" or "ime.co.ir" not in source.get("url",""):
              raise SystemExit("IME source configuration was not persisted")
          print("IME source confirmed:",source.get("product_name"),"currency=",source.get("currency"),"unit=",source.get("measure_unit"))
          last=float(source.get("last_attempt_at") or 0)
          wait=max(0,61-(time.time()*1000-last)/1000)
          if wait: print("Waiting for per-source cooldown:",round(wait),"seconds"); time.sleep(wait+1)
          result=None
          for attempt in range(3):
              try:
                  result=request("/public/sources/"+urllib.parse.quote(sid,safe="")+"/check","POST")
                  break
              except RuntimeError as error:
                  message=str(error)
                  if "source_cooldown" not in message or attempt==2: raise
                  import re
                  match=re.search(r"retry_after_seconds\\D+(\\d+)",message)
                  delay=int(match.group(1))+2 if match else 62
                  print("Cooldown still active; retrying after",delay,"seconds")
                  time.sleep(delay)
          if not result or result.get("stored") is not True or not (float(result.get("price") or 0)>0):
              raise SystemExit("IME did not return a storable traded price: "+str(result))
          rows=request("/public/observations?product_key="+urllib.parse.quote(source["product_key"],safe=""))
          if not any(row.get("source_id")==sid and row.get("observed_at")==result.get("observed_at") for row in rows):
              raise SystemExit("IME price was returned but no matching D1 observation was found")
          print("OFFICIAL IME PRICE VERIFIED:",result["price"],result.get("currency"),"/",result.get("measure_unit"),"trade date:",result.get("source_date"))
          print("IME D1 WRITE VERIFIED:",result.get("observed_at"))
          PY
