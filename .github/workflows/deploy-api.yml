name: Deploy Fooladban API
on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Cloudflare deployment
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          APP_ORIGIN: ${{ vars.FOOLADB_APP_ORIGIN }}
          ALLOWED_HOSTS: ${{ vars.FOOLADB_ALLOWED_HOSTS }},qeymato.com,ime.co.ir,markazeahan.com,t.me,markazeahan.com,tradingeconomics.com,fa.tradingeconomics.com
        run: |
          test -n "$D1_DATABASE_ID" || (echo "Missing D1_DATABASE_ID secret" && exit 1)
          test -n "$APP_ORIGIN" || (echo "Missing FOOLADB_APP_ORIGIN variable" && exit 1)
          test -n "$ALLOWED_HOSTS" || (echo "Missing FOOLADB_ALLOWED_HOSTS variable" && exit 1)
          sed -i "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$D1_DATABASE_ID/" workers/wrangler.toml
          sed -i "s|https://YOUR_GITHUB_PAGES_DOMAIN|$APP_ORIGIN|" workers/wrangler.toml
          sed -i "s|example.com,prices.example.ir|$ALLOWED_HOSTS|" workers/wrangler.toml
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute fooladban-db --remote --file=workers/schema.sql --config workers/wrangler.toml
      - name: Deploy API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/wrangler.toml
      - name: Set API and FX secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.FOOLADB_API_TOKEN }}
          USD_IRR: ${{ secrets.FOOLADB_USD_IRR }}
          AED_IRR: ${{ secrets.FOOLADB_AED_IRR }}
          EUR_IRR: ${{ secrets.FOOLADB_EUR_IRR }}
          CNY_IRR: ${{ secrets.FOOLADB_CNY_IRR }}
          INR_IRR: ${{ secrets.FOOLADB_INR_IRR }}
          TRY_IRR: ${{ secrets.FOOLADB_TRY_IRR }}
          GBP_IRR: ${{ secrets.FOOLADB_GBP_IRR }}
        run: |
          test -n "$API_TOKEN" || (echo "Missing FOOLADB_API_TOKEN secret" && exit 1)
          printf '%s' "$API_TOKEN" | npx --yes wrangler@4 secret put API_TOKEN --config workers/wrangler.toml
          for name in USD_IRR AED_IRR EUR_IRR CNY_IRR INR_IRR TRY_IRR GBP_IRR; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --config workers/wrangler.toml; fi
          done
      - name: Verify deployed API health, CORS, and D1 read endpoints
        run: |
          API="https://fooladban-steel-api.n-razaniemail.workers.dev"
          ORIGIN="https://nrazaniemail-ship-it.github.io"
          curl -fsS --max-time 20 "$API/health" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d; print('Health endpoint: OK')"
          curl -fsS --max-time 30 "$API/public/sources" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 sources endpoint: OK ('+str(len(d))+' rows)')"
          curl -fsS --max-time 30 "$API/public/market" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 market endpoint: OK ('+str(len(d))+' rows)')"
          curl -fsS --max-time 30 "$API/public/events" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 events endpoint: OK ('+str(len(d))+' rows)')"
          PRODUCT_KEY="$(curl -fsS --max-time 30 "$API/public/sources" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0][\"product_key\"] if d else \"\")")"
          if [ -n "$PRODUCT_KEY" ]; then
            curl -fsS --max-time 30 --get --data-urlencode "product_key=$PRODUCT_KEY" "$API/public/observations" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 observations endpoint: OK ('+str(len(d))+' rows)')"
          else
            echo "D1 observations endpoint: skipped (no registered sources)"
          fi
          curl -sS --max-time 20 -D /tmp/fooladban-cors-headers -o /dev/null -X OPTIONS "$API/health" -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,content-type"
          grep -qi "access-control-allow-origin: $ORIGIN" /tmp/fooladban-cors-headers
          echo "Browser CORS preflight: OK"

      - name: Probe all seven live price sources
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          api = "https://fooladban-steel-api.n-razaniemail.workers.dev/public/price?"
          common = {
            "product_key":"hot-rolled",
            "product_name":"ورق گرم",
            "specification":"2 میلیمتر عرض 1.25 فولاد مبارکه برش خورده",
            "source_kind":"free_market",
            "parser_mode":"auto",
            "currency":"IRT",
            "measure_unit":"kg",
            "delivery":"بنگاه تهران"
          }
          probes = [
            ("IME","https://www.ime.co.ir/offer-stat.html","IRR","kg"),
            ("Ahanonline","https://ahanonline.com/product-category/ورق-سیاه/","IRT","kg"),
            ("Markaz Ahan","https://markazeahan.com/","IRT","kg"),
            ("Pivan","https://pivan.co/","IRT","kg"),
            ("Iromart","https://iromart.com/sheet/hot-rolled-steel/","IRT","kg"),
            ("Ahanprice","https://ahanprice.com/Price/ورق-سیاه","IRT","kg"),
            ("Trading Economics","https://fa.tradingeconomics.com/commodity/hrc-steel","USD","ton")
          ]
          for name,url,currency,unit in probes:
            params={**common,"url":url,"currency":currency,"measure_unit":unit}
            if name=="Markaz Ahan":
              params["specification"]="2 میلیمتر عرض 1.25 فولاد سبا"
              params["delivery"]="انبار اصفهان"
            if name=="Ahanprice":
              params["specification"]="2 میلیمتر عرض 1.25 فولاد مبارکه شیت 2500*1250"
              params["delivery"]=""
            if name=="Pivan":
              params["specification"]="2 میلیمتر عرض 1.25 فولاد مبارکه برش خورده"
              params["delivery"]="انبار تهران"
            if name=="Iromart":
              params["specification"]="20 میلیمتر کاویان"
              params["delivery"]="انبار اهواز"
            if name=="Iromart":
              params["specification"]="2 میلیمتر عرض 1.25 فولاد مبارکه رول"
              params["delivery"]="انبار تهران"
            if name=="Trading Economics":
              params["product_name"]="Hot Rolled Coil Steel"
              params["specification"]="HRC"
            req=urllib.request.Request(api+urllib.parse.urlencode(params),headers={"Accept":"application/json","User-Agent":"FooladbanSevenSourceProbe/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=45) as response:
                status=response.status
                data=json.loads(response.read().decode("utf-8"))
              if data.get("ok") and float(data.get("price") or 0)>0:
                print(f"SOURCE_RESULT {name}: PASS price={data['price']} {currency}/{unit} source_date={data.get('source_date')}")
              else:
                print(f"SOURCE_RESULT {name}: FAIL HTTP={status} error={data.get('error','no_price')}")
            except urllib.error.HTTPError as exc:
              try: detail=exc.read().decode("utf-8")[:400]
              except: detail=""
              print(f"SOURCE_RESULT {name}: FAIL HTTP={exc.code} detail={detail}")
            except Exception as exc:
              print(f"SOURCE_RESULT {name}: FAIL {type(exc).__name__}: {exc}")
          PY

      - name: Diagnose live Pivan price table markup
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, re, html as html_module
          api="https://fooladban-steel-api.n-razaniemail.workers.dev/public/fetch?"
          def get_page(url):
            req=urllib.request.Request(api+urllib.parse.urlencode({"url":url}),headers={"Accept":"application/json","User-Agent":"FooladbanSourceDiagnostics/1.0"})
            with urllib.request.urlopen(req,timeout=40) as response: return json.loads(response.read().decode("utf-8")).get("body","")
          try:
            html=get_page("https://pivan.co/")
            print("PIVAN_HTML_LENGTH",len(html))
            for term in ["ورق سیاه","آخرین بروزرسانی","قیمت روز آهن","166,400","168,200","قیمت"]:
              positions=[m.start() for m in re.finditer(re.escape(term),html,re.I)]
              print("PIVAN_TERM",term,"COUNT",len(positions),"LAST",positions[-8:])
              for pos in positions[-5:]:
                snippet=re.sub(r"\s+"," ",html[max(0,pos-350):pos+900])
                print("PIVAN_CONTEXT",term,pos,snippet[:1300])
            print("PIVAN_TR_COUNT",len(re.findall(r"<tr\b",html,re.I)))
            print("PIVAN_TD_COUNT",len(re.findall(r"<td\b",html,re.I)))
            print("PIVAN_SCRIPT_COUNT",len(re.findall(r"<script\b",html,re.I)))
          except Exception as exc: print("PIVAN_DIAGNOSTIC_FAILED",repr(exc))
          try:
            html=get_page("https://t.me/s/iromart")
            messages=re.findall(r'<div[^>]*class="[^"]*tgme_widget_message_text[^"]*"[^>]*>([\s\S]*?)</div>',html,re.I)
            print("IROMART_MESSAGE_COUNT",len(messages))
            for msg in messages[-8:]:
              clean=html_module.unescape(re.sub(r"<[^>]+>"," ",msg))
              print("IROMART_POST",re.sub(r"\s+"," ",clean)[:500])
          except Exception as exc: print("IROMART_DIAGNOSTIC_FAILED",repr(exc))
          try:
            html=get_page("https://t.me/s/Iromart_co")
            messages=re.findall(r'<div[^>]*class="[^"]*tgme_widget_message_text[^"]*"[^>]*>([\s\S]*?)</div>',html,re.I)
            print("IROMART_CO_MESSAGE_COUNT",len(messages))
            for msg in messages[-8:]:
              clean=html_module.unescape(re.sub(r"<[^>]+>"," ",msg))
              print("IROMART_CO_POST",re.sub(r"\s+"," ",clean)[:600])
          except Exception as exc: print("IROMART_CO_DIAGNOSTIC_FAILED",repr(exc))
          PY

      - name: Register and verify independent black-sheet Pivan source in D1
        env:
          API_TOKEN: ${{ secrets.FOOLADB_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          API = "https://fooladban-steel-api.n-razaniemail.workers.dev"
          TOKEN = os.environ.get("API_TOKEN", "")
          if not TOKEN:
            raise SystemExit("Missing FOOLADB_API_TOKEN")
          source = {
            "id": "pivan-black-sheet-2mm-mobarakeh-1250-tehran",
            "product_key": "black-sheet",
            "product_name": "ورق سیاه",
            "specification": "2 میلیمتر عرض 1.25 فولاد مبارکه برش خورده 2500x1250",
            "source_kind": "free_market",
            "market": "Iran",
            "url": "https://pivan.co/",
            "parser_mode": "auto",
            "currency": "IRT",
            "measure_unit": "kg",
            "delivery": "انبار تهران",
            "tax_basis": "",
            "interval_minutes": 15
          }
          def call(path, method="GET", payload=None, auth=False):
            data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode()
            headers = {"Accept":"application/json", "User-Agent":"FooladbanBlackSheetD1Verification/1.0"}
            if data is not None: headers["Content-Type"] = "application/json"
            if auth: headers["Authorization"] = "Bearer " + TOKEN
            req = urllib.request.Request(API + path, data=data, headers=headers, method=method)
            with urllib.request.urlopen(req, timeout=60) as response:
              return json.loads(response.read().decode("utf-8"))
          # First prove the live Pivan page has one exact, unambiguous price for this variant.
          query = urllib.parse.urlencode({
            "url":source["url"], "product_key":source["product_key"],
            "product_name":source["product_name"], "specification":source["specification"],
            "source_kind":source["source_kind"], "parser_mode":"auto",
            "currency":source["currency"], "measure_unit":source["measure_unit"],
            "delivery":source["delivery"]
          })
          preview = call("/public/price?" + query)
          if not preview.get("ok") or float(preview.get("price") or 0) <= 0:
            raise SystemExit("PIVAN_BLACK_SHEET_PRECHECK_FAILED: " + json.dumps(preview, ensure_ascii=False))
          print("PIVAN_BLACK_SHEET_LIVE_PRICE:", preview["price"], preview["currency"], "/", preview["measure_unit"], "source_date=", preview.get("source_date"))
          # Preserve any other registered source rows; upsert this exact independent source.
          existing = call("/public/sources")
          matches = [x for x in existing if x.get("product_key") == "black-sheet"]
          print("BLACK_SHEET_SOURCES_BEFORE:", json.dumps(matches, ensure_ascii=False))
          created = call("/sources", "POST", source, auth=True)
          if not created.get("ok") or created.get("id") != source["id"]:
            raise SystemExit("BLACK_SHEET_SOURCE_REGISTER_FAILED: " + json.dumps(created, ensure_ascii=False))
          checked = call("/sources/" + urllib.parse.quote(source["id"], safe="") + "/check", "POST", {}, auth=True)
          if not checked.get("ok") or not checked.get("stored") or float(checked.get("price") or 0) <= 0:
            raise SystemExit("BLACK_SHEET_SOURCE_CHECK_FAILED: " + json.dumps(checked, ensure_ascii=False))
          rows = call("/public/observations?" + urllib.parse.urlencode({"product_key":"black-sheet"}))
          persisted = [x for x in rows if x.get("source_id") == source["id"] and float(x.get("raw_price") or 0) == float(checked["price"])]
          if not persisted:
            raise SystemExit("BLACK_SHEET_OBSERVATION_NOT_PERSISTED: " + json.dumps(rows[:5], ensure_ascii=False))
          registered = call("/public/sources")
          saved = next((x for x in registered if x.get("id") == source["id"]), None)
          if not saved or saved.get("product_key") != "black-sheet" or not saved.get("enabled"):
            raise SystemExit("BLACK_SHEET_SOURCE_NOT_VISIBLE_IN_D1: " + json.dumps(saved, ensure_ascii=False))
          print("BLACK_SHEET_D1_SOURCE_REGISTERED:", json.dumps(saved, ensure_ascii=False))
          print("BLACK_SHEET_D1_OBSERVATION_STORED:", json.dumps(persisted[0], ensure_ascii=False))
          print("BLACK_SHEET_END_TO_END: PASS")
          PY

      - name: Register and verify independent hot-rolled sheet and coil sources in D1
        env:
          API_TOKEN: ${{ secrets.FOOLADB_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          API = "https://fooladban-steel-api.n-razaniemail.workers.dev"
          TOKEN = os.environ.get("API_TOKEN", "")
          if not TOKEN: raise SystemExit("Missing FOOLADB_API_TOKEN")
          common = {
            "source_kind":"free_market", "market":"Iran", "url":"https://pivan.co/",
            "parser_mode":"auto", "currency":"IRT", "measure_unit":"kg",
            "tax_basis":"", "interval_minutes":15
          }
          sources = [
            {**common,
             "id":"pivan-hot-rolled-sheet-2mm-mobarakeh-1250x2500-tehran",
             "product_key":"hot-rolled-sheet", "product_name":"ورق گرم (سیاه)-تخت",
             "specification":"ضخامت 2 میلیمتر عرض 1250 میلیمتر طول 2500 میلیمتر فولاد مبارکه برش خورده",
             "delivery":"انبار تهران"},
            {**common,
             "id":"pivan-hot-rolled-coil-2mm-mobarakeh-1250-isfahan",
             "product_key":"hot-rolled-coil", "product_name":"ورق گرم (سیاه)-کلاف",
             "specification":"ضخامت 2 میلیمتر عرض 1250 میلیمتر فولاد مبارکه رول",
             "delivery":"اصفهان"}
          ]
          def call(path, method="GET", payload=None, auth=False):
            data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode()
            headers={"Accept":"application/json","User-Agent":"FooladbanSheetCoilD1Verification/1.0"}
            if data is not None: headers["Content-Type"]="application/json"
            if auth: headers["Authorization"]="Bearer "+TOKEN
            req=urllib.request.Request(API+path,data=data,headers=headers,method=method)
            with urllib.request.urlopen(req,timeout=60) as response:
              return json.loads(response.read().decode("utf-8"))
          # Emit only the matching public Pivan rows to diagnose the live coil form.
          try:
            raw=call("/public/fetch?"+urllib.parse.urlencode({"url":"https://pivan.co/"}))
            import re
            for tr in re.findall(r"<tr\b[^>]*>([\s\S]*?)</tr>",raw.get("body",""),re.I):
              cells=[re.sub(r"<[^>]+>"," ",x).replace("&nbsp;"," ").strip() for x in re.findall(r"<td\b[^>]*>([\s\S]*?)</td>",tr,re.I)]
              if cells and "ورق سیاه" in cells[0] and re.search(r"-\s*2\s*-",cells[0]):
                print("PIVAN_2MM_ROW",json.dumps(cells,ensure_ascii=False))
          except Exception as exc:
            print("PIVAN_2MM_DIAGNOSTIC_ERROR",repr(exc))
          # Do not create either D1 source unless BOTH live prices match their own physical form.
          previews=[]
          for source in sources:
            query=urllib.parse.urlencode({
              "url":source["url"],"product_key":source["product_key"],
              "product_name":source["product_name"],"specification":source["specification"],
              "source_kind":source["source_kind"],"parser_mode":source["parser_mode"],
              "currency":source["currency"],"measure_unit":source["measure_unit"],
              "delivery":source["delivery"]})
            result=call("/public/price?"+query)
            if not result.get("ok") or float(result.get("price") or 0)<=0:
              raise SystemExit("LIVE_PRICE_PRECHECK_FAILED "+source["product_key"]+": "+json.dumps(result,ensure_ascii=False))
            previews.append(result)
            print("LIVE_PRICE_PRECHECK_PASS",source["product_key"],result["price"],result.get("currency"),result.get("measure_unit"),"source_date=",result.get("source_date"))
          # Register and check each distinct product-key/source-id pair.
          for source,preview in zip(sources,previews):
            created=call("/sources","POST",source,auth=True)
            if not created.get("ok") or created.get("id")!=source["id"]:
              raise SystemExit("SOURCE_REGISTER_FAILED "+source["id"]+": "+json.dumps(created,ensure_ascii=False))
            checked=call("/sources/"+urllib.parse.quote(source["id"],safe="")+"/check","POST",{},auth=True)
            if not checked.get("ok") or not checked.get("stored") or float(checked.get("price") or 0)<=0:
              raise SystemExit("SOURCE_CHECK_FAILED "+source["id"]+": "+json.dumps(checked,ensure_ascii=False))
            if float(checked["price"])!=float(preview["price"]):
              raise SystemExit("PRICE_CHANGED_DURING_CHECK "+source["id"]+": preview="+str(preview["price"])+" stored="+str(checked["price"]))
            rows=call("/public/observations?"+urllib.parse.urlencode({"product_key":source["product_key"]}))
            found=[x for x in rows if x.get("source_id")==source["id"] and float(x.get("raw_price") or 0)==float(checked["price"])]
            if not found:
              raise SystemExit("D1_OBSERVATION_MISSING "+source["id"]+": "+json.dumps(rows[:5],ensure_ascii=False))
            visible=call("/public/sources")
            saved=next((x for x in visible if x.get("id")==source["id"]),None)
            if not saved or saved.get("product_key")!=source["product_key"] or not saved.get("enabled"):
              raise SystemExit("D1_SOURCE_NOT_ENABLED "+source["id"]+": "+json.dumps(saved,ensure_ascii=False))
            print("D1_SOURCE_PASS",source["product_key"],json.dumps(saved,ensure_ascii=False))
            print("D1_OBSERVATION_PASS",source["product_key"],json.dumps(found[0],ensure_ascii=False))
          print("HOT_ROLLED_SHEET_AND_COIL_END_TO_END: PASS")
          PY

      - name: Probe live Markaz Ahan hot-rolled sheet feed
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          base = "https://fooladban-steel-api.n-razaniemail.workers.dev/public/price?"
          params = {
            "url":"https://markazeahan.com/",
            "product_key":"hot-rolled",
            "product_name":"ورق گرم",
            "specification":"2 میلیمتر عرض 1.25 فولاد سبا",
            "source_kind":"free_market",
            "parser_mode":"auto",
            "currency":"IRT",
            "measure_unit":"kg",
            "delivery":"انبار اصفهان"
          }
          req=urllib.request.Request(base+urllib.parse.urlencode(params),headers={"Accept":"application/json","User-Agent":"FooladbanLiveSourceProbe/1.0"})
          try:
            with urllib.request.urlopen(req,timeout=45) as response:
              result=json.loads(response.read().decode("utf-8"))
            if float(result.get("price") or 0)<=0: raise RuntimeError(str(result))
            print("MARKAZ AHAN LIVE PRICE:",result["price"],result.get("currency"),"/",result.get("measure_unit"))
          except Exception as exc:
            print("MARKAZ AHAN LIVE PRICE PROBE FAILED:",repr(exc))
          PY
