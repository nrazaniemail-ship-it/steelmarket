name: Deploy Fooladban API
on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Cloudflare deployment
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          APP_ORIGIN: ${{ vars.FOOLADB_APP_ORIGIN }}
          ALLOWED_HOSTS: ${{ vars.FOOLADB_ALLOWED_HOSTS }},qeymato.com,ime.co.ir,markazeahan.com,t.me,markazeahan.com,tradingeconomics.com
        run: |
          test -n "$D1_DATABASE_ID" || (echo "Missing D1_DATABASE_ID secret" && exit 1)
          test -n "$APP_ORIGIN" || (echo "Missing FOOLADB_APP_ORIGIN variable" && exit 1)
          test -n "$ALLOWED_HOSTS" || (echo "Missing FOOLADB_ALLOWED_HOSTS variable" && exit 1)
          sed -i "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$D1_DATABASE_ID/" workers/wrangler.toml
          sed -i "s|https://YOUR_GITHUB_PAGES_DOMAIN|$APP_ORIGIN|" workers/wrangler.toml
          sed -i "s|example.com,prices.example.ir|$ALLOWED_HOSTS|" workers/wrangler.toml
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute fooladban-db --remote --file=workers/schema.sql --config workers/wrangler.toml
      - name: Deploy API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/wrangler.toml
      - name: Set API and FX secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.FOOLADB_API_TOKEN }}
          USD_IRR: ${{ secrets.FOOLADB_USD_IRR }}
          AED_IRR: ${{ secrets.FOOLADB_AED_IRR }}
          EUR_IRR: ${{ secrets.FOOLADB_EUR_IRR }}
          CNY_IRR: ${{ secrets.FOOLADB_CNY_IRR }}
          INR_IRR: ${{ secrets.FOOLADB_INR_IRR }}
          TRY_IRR: ${{ secrets.FOOLADB_TRY_IRR }}
          GBP_IRR: ${{ secrets.FOOLADB_GBP_IRR }}
        run: |
          test -n "$API_TOKEN" || (echo "Missing FOOLADB_API_TOKEN secret" && exit 1)
          printf '%s' "$API_TOKEN" | npx --yes wrangler@4 secret put API_TOKEN --config workers/wrangler.toml
          for name in USD_IRR AED_IRR EUR_IRR CNY_IRR INR_IRR TRY_IRR GBP_IRR; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --config workers/wrangler.toml; fi
          done
      - name: Verify deployed API health, CORS, and D1 read endpoints
        run: |
          API="https://fooladban-steel-api.n-razaniemail.workers.dev"
          ORIGIN="https://nrazaniemail-ship-it.github.io"
          curl -fsS --max-time 20 "$API/health" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d; print('Health endpoint: OK')"
          curl -fsS --max-time 30 "$API/public/sources" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 sources endpoint: OK ('+str(len(d))+' rows)')"
          curl -fsS --max-time 30 "$API/public/market" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 market endpoint: OK ('+str(len(d))+' rows)')"
          curl -fsS --max-time 30 "$API/public/events" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 events endpoint: OK ('+str(len(d))+' rows)')"
          PRODUCT_KEY="$(curl -fsS --max-time 30 "$API/public/sources" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0][\"product_key\"] if d else \"\")")"
          if [ -n "$PRODUCT_KEY" ]; then
            curl -fsS --max-time 30 --get --data-urlencode "product_key=$PRODUCT_KEY" "$API/public/observations" | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list), d; print('D1 observations endpoint: OK ('+str(len(d))+' rows)')"
          else
            echo "D1 observations endpoint: skipped (no registered sources)"
          fi
          curl -sS --max-time 20 -D /tmp/fooladban-cors-headers -o /dev/null -X OPTIONS "$API/health" -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,content-type"
          grep -qi "access-control-allow-origin: $ORIGIN" /tmp/fooladban-cors-headers
          echo "Browser CORS preflight: OK"

      - name: Probe all seven live price sources
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          api = "https://fooladban-steel-api.n-razaniemail.workers.dev/public/price?"
          common = {
            "product_key":"hot-rolled",
            "product_name":"ورق گرم",
            "specification":"2 میلیمتر عرض 1.25 فولاد مبارکه",
            "source_kind":"free_market",
            "parser_mode":"auto",
            "currency":"IRT",
            "measure_unit":"kg",
            "delivery":"کارخانه"
          }
          probes = [
            ("IME","https://www.ime.co.ir/offer-stat.html","IRR","kg"),
            ("Ahanonline","https://ahanonline.com/product-category/انواع-ورق/ورق-سیاه/","IRT","kg"),
            ("Markaz Ahan","https://markazeahan.com/","IRT","kg"),
            ("Pivan","https://pivan.co/product-category/sheet/st37-sheet/","IRT","kg"),
            ("Iromart","https://iromart.com/","IRT","kg"),
            ("Ahanprice","https://ahanprice.com/","IRT","kg"),
            ("Trading Economics","https://fa.tradingeconomics.com/commodity/hrc-steel","USD","ton")
          ]
          for name,url,currency,unit in probes:
            params={**common,"url":url,"currency":currency,"measure_unit":unit}
            if name=="Markaz Ahan":
              params["specification"]="2 میلیمتر عرض 1.25 فولاد سبا"
              params["delivery"]="انبار اصفهان"
            if name=="Trading Economics":
              params["product_name"]="Hot Rolled Coil Steel"
              params["specification"]="HRC"
            req=urllib.request.Request(api+urllib.parse.urlencode(params),headers={"Accept":"application/json","User-Agent":"FooladbanSevenSourceProbe/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=45) as response:
                status=response.status
                data=json.loads(response.read().decode("utf-8"))
              if data.get("ok") and float(data.get("price") or 0)>0:
                print(f"SOURCE_RESULT {name}: PASS price={data['price']} {currency}/{unit} source_date={data.get('source_date')}")
              else:
                print(f"SOURCE_RESULT {name}: FAIL HTTP={status} error={data.get('error','no_price')}")
            except urllib.error.HTTPError as exc:
              try: detail=exc.read().decode("utf-8")[:400]
              except: detail=""
              print(f"SOURCE_RESULT {name}: FAIL HTTP={exc.code} detail={detail}")
            except Exception as exc:
              print(f"SOURCE_RESULT {name}: FAIL {type(exc).__name__}: {exc}")
          PY

      - name: Probe live Markaz Ahan hot-rolled sheet feed
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          base = "https://fooladban-steel-api.n-razaniemail.workers.dev/public/price?"
          params = {
            "url":"https://markazeahan.com/",
            "product_key":"hot-rolled",
            "product_name":"ورق گرم",
            "specification":"2 میلیمتر عرض 1.25 فولاد سبا",
            "source_kind":"free_market",
            "parser_mode":"auto",
            "currency":"IRT",
            "measure_unit":"kg",
            "delivery":"انبار اصفهان"
          }
          req=urllib.request.Request(base+urllib.parse.urlencode(params),headers={"Accept":"application/json","User-Agent":"FooladbanLiveSourceProbe/1.0"})
          try:
            with urllib.request.urlopen(req,timeout=45) as response:
              result=json.loads(response.read().decode("utf-8"))
            if float(result.get("price") or 0)<=0: raise RuntimeError(str(result))
            print("MARKAZ AHAN LIVE PRICE:",result["price"],result.get("currency"),"/",result.get("measure_unit"))
          except Exception as exc:
            print("MARKAZ AHAN LIVE PRICE PROBE FAILED:",repr(exc))
          PY
