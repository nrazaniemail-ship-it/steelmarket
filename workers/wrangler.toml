name = "fooladban-steel-api"
main = "steel-api.js"
compatibility_date = "2026-11-01"
[triggers]
crons = ["*/15 * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "fooladban"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
[vars]
APP_ORIGIN = "https://YOUR_GITHUB_PAGES_DOMAIN"
ALLOWED_HOSTS = "example.com,prices.example.ir"
# Configure API_TOKEN, USD_IRR, AED_IRR and EUR_IRR as secrets/vars